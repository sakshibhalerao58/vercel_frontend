<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <h1>📚 Smart Library</h1>

  <!-- Form Card -->
  <div class="card">
    <form id="bookForm">
      <input id="title" placeholder="Book Title" required>
      <input id="author" placeholder="Author" required>
      <input id="year" type="number" placeholder="Year" required>
      <button>Add Book</button>
    </form>
  </div>

  <!-- Search -->
  <div class="search-box card">
    <input id="searchInput" placeholder="🔍 Search books...">
    <button onclick="searchBooks()">Search</button>
    <button class="reset" onclick="getBooks()">Reset</button>
  </div>

  <!-- Table -->
  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Author</th>
          <th>Year</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
